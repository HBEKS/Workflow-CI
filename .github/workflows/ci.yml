name: MLflow CI Workflow - Complete

on:
  push:
    branches: [ main, master ]
    paths:
      - 'MLProject/**'
      - 'loan_preprocessing/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: Training (Basic)
  # ============================================
  training:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.get_run_id.outputs.run_id }}
      model_path: ${{ steps.find_model.outputs.model_path }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib seaborn protobuf==3.20.3
    
    - name: Verify installation
      run: |
        python --version
        python -c "import mlflow; print(f'MLflow: {mlflow.__version__}')"
        python -c "import sklearn; print(f'Scikit-learn: {sklearn.__version__}')"
    
    - name: Run training
      run: |
        cd MLProject
        python modelling.py
    
    - name: Get Run ID
      id: get_run_id
      run: |
        RUN_ID=$(ls -t MLProject/mlruns/*/*/meta.yaml 2>/dev/null | head -1 | xargs grep "run_id:" 2>/dev/null | cut -d" " -f2)
        echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        echo "Run ID: $RUN_ID"
    
    - name: Find model path
      id: find_model
      run: |
        MODEL_PATH=$(find MLProject/mlruns -name "ci_model" -type d 2>/dev/null | head -1)
        echo "model_path=$MODEL_PATH" >> $GITHUB_OUTPUT
        echo "Model path: $MODEL_PATH"
    
    - name: Upload MLflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: MLProject/mlruns/
    
    - name: List artifacts
      run: |
        echo "=== Training Results ==="
        echo "Run ID: ${{ steps.get_run_id.outputs.run_id }}"
        echo "Model: ${{ steps.find_model.outputs.model_path }}"
        find MLProject -name "*.png" 2>/dev/null || echo "No images found"
        find MLProject -name "*.csv" 2>/dev/null || echo "No CSV found"

  # ============================================
  # JOB 2: Upload to GitHub Release (Skilled)
  # ============================================
  release:
    runs-on: ubuntu-latest
    needs: training
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download artifacts from training
      uses: actions/download-artifact@v4
      with:
        name: mlflow-artifacts
        path: mlruns/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "MLflow Training Run #${{ github.run_number }}"
        body: |
          ## MLflow Training Results
          
          - **Run ID:** ${{ needs.training.outputs.run_id }}
          - **Date:** ${{ github.event.head_commit.timestamp }}
          - **Commit:** ${{ github.sha }}
          
          ### Artifacts included:
          - Confusion Matrix
          - ROC Curve
          - Feature Importance
          - Trained Model (MLflow format)
        files: |
          mlruns/**/*.png
          mlruns/**/*.pkl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # JOB 3: Docker Build & Push (Advanced)
  # ============================================
  docker:
    runs-on: ubuntu-latest
    needs: training
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: mlflow-artifacts
        path: MLProject/mlruns/
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Check Docker secrets exist
      id: check_secrets
      run: |
        if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
          echo "docker_available=true" >> $GITHUB_OUTPUT
        else
          echo "docker_available=false" >> $GITHUB_OUTPUT
          echo "Docker secrets not set, skipping Docker build"
        fi
    
    - name: Log in to Docker Hub
      if: steps.check_secrets.outputs.docker_available == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build Docker image with MLflow
      if: steps.check_secrets.outputs.docker_available == 'true'
      run: |
        cd MLProject
        mlflow models build-docker \
          -m "${{ needs.training.outputs.model_path }}" \
          -n ${{ secrets.DOCKER_USERNAME }}/mlflow-loan-approval:${{ github.run_number }} \
          --enable-mlserver
    
    - name: Tag and push Docker image
      if: steps.check_secrets.outputs.docker_available == 'true'
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/mlflow-loan-approval:${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/mlflow-loan-approval:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-loan-approval:${{ github.run_number }}
        docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-loan-approval:latest
    
    - name: Verify Docker image
      if: steps.check_secrets.outputs.docker_available == 'true'
      run: |
        docker images | grep mlflow-loan-approval
        echo "Docker image pushed successfully!"
    
    - name: Skip Docker build
      if: steps.check_secrets.outputs.docker_available != 'true'
      run: |
        echo "Docker secrets not configured, skipping Docker build"
        echo "To enable Docker, add DOCKER_USERNAME and DOCKER_PASSWORD secrets in GitHub Settings"