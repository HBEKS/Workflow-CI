name: MLflow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn numpy matplotlib seaborn protobuf==3.20.3

      - name: Run training
        id: train
        run: |
          cd MLProject
          python modelling.py
          RUN_ID=$(cat run_id.txt 2>/dev/null || echo "")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Find model path
        id: find_model
        run: |
          cd MLProject
          MODEL_PATH=$(find mlruns -name "MLmodel" -type f | head -1 | xargs dirname)
          echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
          echo "Model found at: $MODEL_PATH"

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/

      - name: Build Docker Model
        run: |
          cd MLProject
          if [ -n "${{ env.MODEL_PATH }}" ]; then
            mlflow models build-docker -m "${{ env.MODEL_PATH }}" -n ${{ secrets.DOCKER_USERNAME }}/loan-approval-model:latest --enable-mlserver
          else
            echo "No model found, skipping Docker build"
          fi

      - name: Log in to Docker Hub
        if: env.MODEL_PATH != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        if: env.MODEL_PATH != ''
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/loan-approval-model:latest